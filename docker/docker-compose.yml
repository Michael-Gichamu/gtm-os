name: gtm-os

services:
  postgres:
    image: postgres:16-alpine
    container_name: gtm-os-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gtm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gtm_local_dev_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-gtm_os}
    ports:
      - "5432:5432"
    volumes:
      - gtm_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gtm} -d ${POSTGRES_DB:-gtm_os}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: gtm-os-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - gtm_redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gtm_pg_data:
  gtm_redis_data:
